[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-diff"
version = "0.1.1"
description = "Geometric diff for mechanical CAD: structured, rendered, CI-gateable diffs of STEP files. git diff for atoms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Argus" }]
keywords = ["cad", "step", "diff", "review", "ci", "mechanical", "geometry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "cadquery>=2.4",
  "trimesh>=4",
  "lxml",  # trimesh's 3MF loader requires it
  "networkx",  # trimesh graph ops (body splitting)
  "scipy",  # mesh change-region clustering
  "rtree",  # trimesh proximity queries
  "numpy",
]

[project.optional-dependencies]
render = ["pyvista>=0.43", "matplotlib"]
dev = ["pytest", "ruff", "pyvista>=0.43", "matplotlib"]

[project.scripts]
argus = "argus_diff.cli:main"

[project.urls]
Homepage = "https://argusdiff.com"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_diff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
