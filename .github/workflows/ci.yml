name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cleanroom:
    # argus-diff is clean-room: it must never reference its incubator's
    # internal projects. Gate enforced from commit one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clean-room grep gate
        run: |
          ! grep -riE 'primordia|trailblazer' --include='*' -l . \
            --exclude-dir=.git --exclude-dir=.github || {
              echo 'clean-room violation: incubator reference found'; exit 1; }

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # the buyer population runs Windows; one lane keeps the install
          # claim honest there
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ examples/
      - if: runner.os == 'Linux'
        run: xvfb-run -a pytest tests/ -v
      - if: runner.os == 'Windows'
        # no xvfb on Windows; rendering falls back to off-screen VTK
        run: pytest tests/ -v
